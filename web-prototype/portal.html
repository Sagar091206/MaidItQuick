<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12231e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>MakeItQuick Portal</title><style>

const key='miq.portal.v1',API=localStorage.getItem('miq.api.base')||'http://localhost:8080/api';let s=JSON.parse(localStorage.getItem(key)||'{"users":[{"name":"Admin","email":"admin@makeitquick.in","password":"admin123","role":"admin"},{"name":"Sagar","email":"sagar@example.com","password":"demo123","role":"customer"},{"name":"Riya Expert","email":"riya@makeitquick.in","password":"demo123","role":"worker"}],"bookings":[{"id":"MIQ-1001","service":"Home cleaning","customer":"Sagar","worker":"Riya Expert","slot":"Today, 3:00 PM","address":"Uttarpara, Hooghly","status":"ASSIGNED"}],"services":[{"name":"Home cleaning","price":149},{"name":"Dishwashing","price":99},{"name":"Laundry & ironing","price":119}],"zones":["Uttarpara 712258","Konnagar 712235"],"tickets":[]}');let user=JSON.parse(sessionStorage.getItem('miq.user')||'null'),page='home';const save=()=>localStorage.setItem(key,JSON.stringify(s));const $=q=>document.querySelector(q);async function api(path,body,method='POST'){let token=sessionStorage.getItem('miq.token'),headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;let r=await fetch(API+path,{method,headers,body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.message||x.detail||'Request failed');return x}
function auth(){root.innerHTML='<form class="auth" id="login"><div class="brand"><span class="mark">M</span>makeitquick</div><h1>Welcome back</h1><p class="small">Production authentication uses the Java API. Demo: admin@makeitquick.in / admin123.</p><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button class="btn">Log in</button><p><button type="button" class="link" onclick="signup()">Create account</button> · <button type="button" class="link" onclick="forgot()">Forgot password?</button></p></form>';$('#login').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let x=await api('/auth/login',f);user={name:x.name,email:f.email,role:x.role.toLowerCase()};sessionStorage.setItem('miq.user',JSON.stringify(user));sessionStorage.setItem('miq.token',x.token);app()}catch(err){let u=s.users.find(x=>x.email===f.email&&x.password===f.password);if(!u)return alert(err.message+' (API unavailable or credentials incorrect.)');user=u;sessionStorage.setItem('miq.user',JSON.stringify(u));app()}}}
function signup(){root.innerHTML='<form class="auth" id="signup"><h1>Create account</h1><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><label>Account type</label><select name="role"><option value="customer">Customer</option><option value="worker">Worker partner</option></select><button class="btn">Create account</button><p><button type="button" class="link" onclick="auth()">Back to log in</button></p></form>';$('#signup').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{await api('/auth/register',x);alert('Account created. Please log in.');auth()}catch(err){if(s.users.some(u=>u.email===x.email))return alert('Email already exists.');s.users.push(x);save();alert('Saved as a local demo account. Start the Java server to create the production account.');auth()}}}
function forgot(){root.innerHTML='<form class="auth" id="forgot"><h1>Reset password</h1><p class="small">The live server sends the reset request to the configured email service. The local demo simulates it.</p><input name="email" type="email" placeholder="Your email" required><button class="btn">Send reset link</button><p><button type="button" class="link" onclick="auth()">Back to log in</button></p></form>';$('#forgot').onsubmit=async e=>{e.preventDefault();let email=new FormData(e.target).get('email');try{await api('/auth/forgot-password',{email});alert('If the account exists, a reset message has been requested.')}catch(err){let u=s.users.find(x=>x.email===email);if(!u)return alert('If the account exists, a reset message has been requested.');let p=prompt('Demo reset: enter a new password');if(p){u.password=p;save();alert('Password changed. Please log in.');auth()}}}}
function app(){let nav=user.role==='admin'?['home','notifications','bookings','services','zones','operations','customers','support']:user.role==='worker'?['home','notifications','jobs','earnings','profile','support']:['home','notifications','book','bookings','account','support'];root.innerHTML='<div class="app"><aside class="side"><div class="brand"><span class="mark">M</span>makeitquick</div><div class="nav">'+nav.map(n=>'<button onclick="go(&quot;'+n+'&quot;)" class="'+(page===n?'on':'')+'">'+n[0].toUpperCase()+n.slice(1)+'</button>').join('')+'</div><button class="logout" onclick="logout()">Log out</button></aside><main class="main"><div class="top"><div><h1 id="title"></h1><span class="small">'+user.name+' · '+user.role+'</span></div><span class="pill">Local MVP</span></div><div id="view"></div></main></div>';go(page)}
function go(p){page=p;appView()}function appView(){let v=$('#view'),t=$('#title');t.textContent=page[0].toUpperCase()+page.slice(1);if(page==='notifications')notificationsView(v);else if(user.role==='customer')customer(v);else if(user.role==='worker')worker(v);else admin(v)}
const rows=a=>a.length?a.map(x=>'<div class="row"><div><b>'+x.id+'</b><div class="small">'+x.service+' · '+x.slot+'<br>'+x.address+'</div></div><span class="status">'+x.status+'</span></div>').join(''):'<p class="small">Nothing here yet.</p>';
async function notificationsView(v){v.innerHTML='<div class="panel"><h3>Notifications</h3><p class="small">Loading your latest updates…</p></div>';try{let items=await api('/notifications',null,'GET');v.innerHTML='<div class="panel"><h3>Notifications</h3>'+(items.length?items.map(n=>'<div class="row"><div><b>'+n.title+'</b><div class="small">'+n.message+'</div></div>'+(n.read?'<span class="status">READ</span>':'<button class="btn" onclick="readNotification('+n.id+')">Mark read</button>')+'</div>').join(''):'<p class="small">No notifications yet.</p>')+'</div>'}catch(err){s.notifications=s.notifications||[{id:'local-1',title:'Welcome to MakeItQuick',message:'Your local notification inbox is ready.',read:false}];v.innerHTML='<div class="panel"><h3>Notifications</h3>'+s.notifications.map(n=>'<div class="row"><div><b>'+n.title+'</b><div class="small">'+n.message+'</div></div>'+(n.read?'<span class="status">READ</span>':'<button class="btn" onclick="readNotification(&quot;'+n.id+'&quot;)">Mark read</button>')+'</div>').join('')+'</div>'}}
function customer(v){s.addresses=s.addresses||[];if(page==='home')v.innerHTML='<div class="grid"><div class="card">Next booking<b>'+s.bookings.filter(b=>b.customer===user.name).length+'</b></div><div class="card">Saved addresses<b>'+s.addresses.length+'</b></div><div class="card">Support<b>24/7</b></div></div><div class="panel"><h3>Quick book</h3><button class="btn" onclick="go(&quot;book&quot;)">Book home help</button></div>';if(page==='book')v.innerHTML='<form class="panel" id="bookform"><h3>New booking</h3><label>Service</label><select name="service">'+s.services.map(x=>'<option>'+x.name+'</option>').join('')+'</select><label>Service option</label><select name="option"><option>Standard</option><option>Deep clean</option><option>Extra care</option></select><label>Duration</label><select name="duration"><option value="60">60 minutes</option><option value="120">120 minutes</option><option value="180">180 minutes</option></select><label>Address</label><textarea name="address" required placeholder="House/flat, road, locality"></textarea><div class="small">'+(s.addresses.length?'Saved: '+s.addresses.map((a,i)=>'<button type="button" class="link" onclick="fillAddress('+i+')">'+a.label+'</button>').join(' · '):'Save addresses in Account for faster booking.')+'</div><label>Schedule</label><input name="slot" value="Tomorrow, 10:00 AM" required><label>Promo code</label><input name="promo" placeholder="Try WELCOME50 or MAKEITQUICK100"><button class="btn">Request booking</button></form>',setTimeout(()=>$('#bookform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),valid=['','WELCOME50','MAKEITQUICK100'];x.promo=x.promo.toUpperCase();if(!valid.includes(x.promo))return alert('Promo code is invalid.');x.discount=x.promo==='WELCOME50'?50:x.promo==='MAKEITQUICK100'?100:0;s.bookings.push({id:'MIQ-'+(1001+s.bookings.length),...x,customer:user.name,worker:'Unassigned',status:'REQUESTED'});save();alert('Booking requested. Admin will assign an expert.');go('bookings')});if(page==='bookings')v.innerHTML='<div class="panel">'+s.bookings.filter(b=>b.customer===user.name).map(b=>'<div class="row"><div><b>'+b.id+' · '+b.service+'</b><div class="small">'+b.slot+' · '+b.duration+' min · '+b.option+' · '+b.status+'</div></div><button class="link" onclick="cancelLocal(&quot;'+b.id+'&quot;)">Cancel</button></div>').join('')+'</div>';if(page==='account')v.innerHTML='<div class="panel"><h3>Profile</h3><p>'+user.name+'<br>'+user.email+'</p><p><b>Your referral code:</b> MIQ-DEMO-'+user.name.toUpperCase().replace(/[^A-Z]/g,'').slice(0,6)+'</p><button class="btn alt" onclick="forgot()">Change password</button></div><form class="panel" id="addressform"><h3>Saved addresses</h3>'+s.addresses.map((a,i)=>'<div class="row"><b>'+a.label+'</b><button type="button" class="link" onclick="removeAddress('+i+')">Remove</button></div>').join('')+'<input name="label" placeholder="Label, e.g. Home" required><textarea name="address" placeholder="Full address" required></textarea><button class="btn">Save address</button></form>',setTimeout(()=>$('#addressform').onsubmit=saveAddress);if(page==='support')support(v)}
function worker(v){let mine=s.bookings.filter(b=>b.worker===user.name||b.worker==='Unassigned');s.workerSafety=s.workerSafety||{kyc:'NOT_SUBMITTED',background:'NOT_SUBMITTED',payout:false};let w=s.workerSafety;if(page==='home')v.innerHTML='<div class="grid"><div class="card">Available jobs<b>'+mine.length+'</b></div><div class="card">Today earnings<b>Rs 0</b></div><div class="card">Availability<b>ON</b></div></div>';if(page==='jobs')v.innerHTML='<div class="panel">'+mine.map(b=>'<div class="row"><div><b>'+b.id+' · '+b.service+'</b><div class="small">'+b.address+' · '+b.slot+'</div></div><button class="btn" onclick="claim(&quot;'+b.id+'&quot;)">'+(b.worker==='Unassigned'?'Accept':'Update')+'</button></div>').join('')+'</div>';if(page==='earnings')v.innerHTML='<div class="panel"><h3>Earnings</h3><p class="small">Completed jobs and payouts will appear here.</p></div>';if(page==='profile'){v.innerHTML='<div class="panel"><h3>Worker safety & verification</h3><div class="row"><b>KYC document</b><span class="status">'+w.kyc+'</span></div><div class="row"><b>Background check</b><span class="status">'+w.background+'</span></div><div class="row"><b>Payout details</b><span class="status">'+(w.payout?'SUBMITTED':'NOT SUBMITTED')+'</span></div><form id="kycform"><label>Identity document (PDF, JPG, or PNG)</label><input name="document" type="file" accept=".pdf,image/jpeg,image/png" required><button class="btn">Submit KYC</button></form><form id="payoutform"><label>Bank account last 4 digits</label><input name="accountLast4" inputmode="numeric" pattern="\\\\d{4}" required><label>IFSC code</label><input name="ifsc" required><button class="btn alt">Save payout details</button></form><p class="small">Documents are reviewed by an administrator before work assignment.</p></div>';$('#kycform').onsubmit=submitKyc;$('#payoutform').onsubmit=savePayout}if(page==='support')support(v)}
function admin(v){if(page==='home')v.innerHTML='<div class="grid"><div class="card">Bookings<b>'+s.bookings.length+'</b></div><div class="card">Customers<b>'+s.users.filter(u=>u.role==='customer').length+'</b></div><div class="card">Workers<b>'+s.users.filter(u=>u.role==='worker').length+'</b></div></div><div class="panel"><h3>Operations dispatch</h3><p class="small">Assign workers and view active bookings on the map.</p><button class="btn" onclick="window.location.href=&quot;dispatch.html&quot;">Open dispatch map</button> <button class="btn alt" onclick="go(&quot;operations&quot;)">Operations controls</button></div>';if(page==='bookings')v.innerHTML='<div class="panel">'+s.bookings.map(b=>'<div class="row"><div><b>'+b.id+' · '+b.service+'</b><div class="small">'+b.customer+' · '+b.address+'</div></div><select onchange="status(&quot;'+b.id+'&quot;,this.value)">'+['REQUESTED','ASSIGNED','ON_THE_WAY','IN_PROGRESS','COMPLETED','CANCELLED'].map(x=>'<option '+(x===b.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join('')+'</div>';if(page==='services')v.innerHTML='<div class="panel"><h3>Services</h3>'+s.services.map(x=>'<div class="row"><b>'+x.name+'</b><span>Rs '+x.price+'</span></div>').join('')+'<button class="btn" onclick="addService()">Add service</button></div>';if(page==='zones')v.innerHTML='<div class="panel"><h3>Service zones</h3>'+s.zones.map(x=>'<div class="row">'+x+'</div>').join('')+'<button class="btn" onclick="addZone()">Add PIN/locality</button></div>';if(page==='operations')operations(v);if(page==='customers')v.innerHTML='<div class="panel">'+s.users.map(u=>'<div class="row"><b>'+u.name+'</b><span class="small">'+u.role+' · '+u.email+'</span></div>').join('')+'</div>';if(page==='support')support(v)}
function operations(v){s.alerts=s.alerts||[{id:'SLA-01',booking:'MIQ-1001',severity:'MEDIUM',message:'Worker is due to arrive in 18 minutes.',resolved:false}];s.refunds=s.refunds||[{id:'REF-01',booking:'MIQ-1001',amount:149,reason:'Customer cancelled before arrival',status:'REQUESTED'}];v.innerHTML='<div class="notice">Demo controls below persist in this browser. The Java server exposes the production endpoints at <b>/api/operations</b> for signed-in administrators.</div><div class="panel"><h3>Service-area / PIN controls</h3>'+s.zones.map((z,i)=>'<div class="row"><div><b>'+z+'</b><div class="small">Accepting bookings</div></div><button class="btn alt" onclick="removeZone('+i+')">Disable</button></div>').join('')+'<button class="btn" onclick="addZone()">Add PIN/locality</button></div><div class="panel"><h3>SLA alerts</h3>'+s.alerts.map(a=>'<div class="row"><div><b>'+a.booking+' · '+a.severity+'</b><div class="small">'+a.message+'</div></div>'+(a.resolved?'<span class="status">RESOLVED</span>':'<button class="btn" onclick="resolveAlert(&quot;'+a.id+'&quot;)">Resolve</button>')+'</div>').join('')+'</div><div class="panel"><h3>Refund requests</h3>'+s.refunds.map(r=>'<div class="row"><div><b>'+r.booking+' · Rs '+r.amount+'</b><div class="small">'+r.reason+' · '+r.status+'</div></div>'+refundButtons(r)+'</div>').join('')+'</div>'}
function refundButtons(r){return r.status==='REQUESTED'?'<span><button class="btn" onclick="refundAction(&quot;'+r.id+'&quot;,&quot;APPROVED&quot;)">Approve</button> <button class="btn alt" onclick="refundAction(&quot;'+r.id+'&quot;,&quot;REJECTED&quot;)">Reject</button></span>':r.status==='APPROVED'?'<button class="btn" onclick="refundAction(&quot;'+r.id+'&quot;,&quot;COMPLETED&quot;)">Mark completed</button>':'<span class="status">'+r.status+'</span>'}
function support(v){v.innerHTML='<form class="panel" id="ticket"><h3>Help centre</h3><label>Subject</label><input name="subject" required placeholder="What do you need help with?"><label>Message</label><textarea name="message" required placeholder="Describe the issue"></textarea><button class="btn">Create support ticket</button></form><div class="panel" id="ticketlist"><p class="small">Loading tickets…</p></div>';$('#ticket').onsubmit=createTicket;user.role==='admin'?adminTicketQueue():myTicketQueue()}
async function createTicket(e){e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{await api('/support/tickets',data);alert('Support ticket created.');e.target.reset();myTicketQueue()}catch(err){s.tickets.push({id:'LOCAL-'+(s.tickets.length+1),from:user.email,subject:data.subject,message:data.message,status:'OPEN'});save();alert('Support ticket saved in the local demo.');e.target.reset();myTicketQueue()}}
async function myTicketQueue(){let box=$('#ticketlist');try{let items=await api('/support/tickets/mine',null,'GET');box.innerHTML='<h3>Your tickets</h3>'+(items.length?items.map(t=>'<div class="row"><div><b>'+t.subject+'</b><div class="small">'+t.message+(t.reply?'<br>Reply: '+t.reply:'')+'</div></div><span class="status">'+t.status+'</span></div>').join(''):'<p class="small">No tickets yet.</p>')}catch(err){let items=s.tickets.filter(t=>t.from===user.email);box.innerHTML='<h3>Your tickets</h3>'+(items.length?items.map(t=>'<div class="row"><div><b>'+t.subject+'</b><div class="small">'+t.message+'</div></div><span class="status">'+t.status+'</span></div>').join(''):'<p class="small">No tickets yet.</p>')}}
async function adminTicketQueue(){let box=$('#ticketlist');try{let items=await api('/support/tickets',null,'GET');box.innerHTML='<h3>Admin support queue</h3>'+(items.length?items.map(t=>'<div class="row"><div><b>'+t.subject+'</b><div class="small">'+t.requester+' · '+t.message+(t.reply?'<br>Reply: '+t.reply:'')+'</div></div><span class="status">'+t.status+'</span></div>').join(''):'<p class="small">No support tickets yet.</p>')}catch(err){box.innerHTML='<h3>Admin support queue</h3>'+(s.tickets.length?s.tickets.map(t=>'<div class="row"><div><b>'+t.subject+'</b><div class="small">'+t.from+' · '+t.message+'</div></div><span class="status">'+t.status+'</span></div>').join(''):'<p class="small">No support tickets yet.</p>')}}
function claim(id){let b=s.bookings.find(x=>x.id===id);b.worker=user.name;b.status='ASSIGNED';save();go('jobs')}function status(id,x){s.bookings.find(b=>b.id===id).status=x;save()}function cancelLocal(id){let b=s.bookings.find(x=>x.id===id);if(b.status==='COMPLETED'||b.status==='IN_PROGRESS')return alert('This booking cannot now be cancelled.');b.status='CANCELLED';save();go('bookings')}function addService(){let n=prompt('Service name'),p=+prompt('Price');if(n&&p){s.services.push({name:n,price:p});save();go('services')}}function addZone(){let z=prompt('PIN and locality');if(z){s.zones.push(z);save();go(page==='operations'?'operations':'zones')}}function removeZone(i){s.zones.splice(i,1);save();go('operations')}function resolveAlert(id){s.alerts.find(a=>a.id===id).resolved=true;save();go('operations')}function refundAction(id,newStatus){s.refunds.find(r=>r.id===id).status=newStatus;save();go('operations')}async function readNotification(id){try{await api('/notifications/'+id+'/read',{});go('notifications')}catch(err){s.notifications.find(n=>n.id===id).read=true;save();go('notifications')}}async function submitKyc(e){e.preventDefault();let file=new FormData(e.target).get('document'),token=sessionStorage.getItem('miq.token');try{if(!token)throw Error('Local demo');let data=new FormData();data.append('document',file);let r=await fetch(API+'/workers/me/kyc',{method:'POST',headers:{Authorization:'Bearer '+token},body:data});if(!r.ok)throw Error('KYC upload failed');let x=await r.json();s.workerSafety={kyc:x.kycStatus,background:x.backgroundCheckStatus,payout:x.payoutDetailsVerified};alert('KYC uploaded for review.')}catch(err){s.workerSafety.kyc='PENDING';s.workerSafety.background='PENDING';alert('KYC saved in the local demo. Start the Java server to submit it for real review.')}save();go('profile')}async function savePayout(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{let r=await api('/workers/me/payout-details',x);s.workerSafety={kyc:r.kycStatus,background:r.backgroundCheckStatus,payout:r.payoutDetailsVerified};alert('Payout details saved.')}catch(err){s.workerSafety.payout=true;alert('Payout details saved in the local demo.')}save();go('profile')}function logout(){sessionStorage.clear();user=null;page='home';auth()}user?app():auth();
function fillAddress(i){let f=$('#bookform');if(f)f.address.value=s.addresses[i].address}function saveAddress(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));s.addresses.push(x);save();go('account')}function removeAddress(i){s.addresses.splice(i,1);save();go('account')}
function updateAvailability(status){s.workerSafety=s.workerSafety||{};if(status==='AVAILABLE'&&s.workerSafety.kyc!=='APPROVED')return alert('Your KYC must be approved before you can go available.');api('/workers/me/availability',{status}).then(x=>{s.workerSafety.availability=x.availability;save();go('profile')}).catch(()=>{s.workerSafety.availability=status;save();go('profile')})}
function appView(){let v=$('#view'),t=$('#title');t.textContent=page[0].toUpperCase()+page.slice(1);if(page==='notifications')notificationsView(v);else if(user.role==='customer')customer(v);else if(user.role==='worker')worker(v);else admin(v);if(user.role==='worker'&&page==='profile'){let w=s.workerSafety||{},state=w.availability||'OFFLINE';v.insertAdjacentHTML('beforeend','<div class="panel"><h3>Availability for dispatch</h3><p class="small">Only KYC-approved workers can go available and receive assignments.</p><div class="row"><b>Current status</b><span class="status">'+state+'</span></div><button class="btn" onclick="updateAvailability(&quot;AVAILABLE&quot;)">Go available</button> <button class="btn alt" onclick="updateAvailability(&quot;OFFLINE&quot;)">Go offline</button></div>')}}
function workerReview(v){v.innerHTML='<div class="panel"><h3>Worker verification queue</h3><p class="small">Loading worker profiles…</p></div>';api('/workers',null,'GET').then(items=>renderWorkerReview(v,items)).catch(()=>{let items=s.users.filter(x=>x.role==='worker').map((x,i)=>({id:i+1,name:x.name,email:x.email,kycStatus:x.kycStatus||'PENDING',backgroundCheckStatus:x.backgroundCheckStatus||'PENDING',availability:x.availability||'OFFLINE'}));renderWorkerReview(v,items)})}function renderWorkerReview(v,items){v.innerHTML='<div class="panel"><h3>Worker verification queue</h3>'+(items.length?items.map(w=>'<div class="row"><div><b>'+w.name+'</b><div class="small">'+w.email+'<br>KYC: '+w.kycStatus+' · Background: '+w.backgroundCheckStatus+' · '+w.availability+'</div></div>'+(w.kycStatus==='PENDING'?'<span><button class="btn" onclick="reviewWorker('+w.id+',&quot;approve&quot;)">Approve</button> <button class="btn alt" onclick="reviewWorker('+w.id+',&quot;reject&quot;)">Reject</button></span>':'<span class="status">'+w.kycStatus+'</span>')+'</div>').join(''):'<p class="small">No worker profiles yet. Workers create a profile when they submit KYC.</p>')+'<p><button class="link" onclick="go(&quot;home&quot;)">Back to admin home</button></p></div>'}function reviewWorker(id,action){api('/workers/'+id+'/'+action,{}).then(()=>workerReview($('#view'))).catch(()=>{let u=s.users.filter(x=>x.role==='worker')[id-1];if(u)u.kycStatus=action==='approve'?'APPROVED':'REJECTED';save();workerReview($('#view'))})}
function appView(){let v=$('#view'),t=$('#title');t.textContent=page[0].toUpperCase()+page.slice(1);if(page==='notifications')notificationsView(v);else if(user.role==='customer')customer(v);else if(user.role==='worker')worker(v);else admin(v);if(user.role==='worker'&&page==='profile'){let w=s.workerSafety||{},state=w.availability||'OFFLINE';v.insertAdjacentHTML('beforeend','<div class="panel"><h3>Availability for dispatch</h3><p class="small">Only KYC-approved workers can go available and receive assignments.</p><div class="row"><b>Current status</b><span class="status">'+state+'</span></div><button class="btn" onclick="updateAvailability(&quot;AVAILABLE&quot;)">Go available</button> <button class="btn alt" onclick="updateAvailability(&quot;OFFLINE&quot;)">Go offline</button></div>')}if(user.role==='admin'&&page==='home')v.insertAdjacentHTML('beforeend','<div class="panel"><h3>Worker verification</h3><p class="small">Review submitted KYC documents and control which workers can receive jobs.</p><button class="btn" onclick="workerReview(document.querySelector(&quot;#view&quot;))">Open worker review queue</button></div>')}
function requestRefund(id){let amount=prompt('Enter refund amount in rupees');if(!amount||isNaN(amount)||Number(amount)<=0)return;let reason=prompt('Reason for refund request');if(!reason)return;api('/bookings/'+id+'/refund-request',{reason,amountPaise:Math.round(Number(amount)*100)}).then(()=>alert('Refund request submitted for admin review.')).catch(()=>{s.refunds=s.refunds||[];s.refunds.push({id:'REF-'+(s.refunds.length+1),booking:'MIQ-'+id,amount:Number(amount),reason,status:'REQUESTED'});save();alert('Refund request saved in the local demo.')})}
function addRefundButtons(){if(!user||user.role!=='customer'||page!=='bookings')return;let cancelled=s.bookings.filter(b=>b.customer===user.name&&b.status==='CANCELLED');if(cancelled.length)$('#view').insertAdjacentHTML('beforeend','<div class="panel"><h3>Refund requests</h3><p class="small">Cancelled booking refunds are reviewed by an admin. Payment transfer remains disabled until a payment gateway is added.</p>'+cancelled.map(b=>'<button class="btn" onclick="requestRefund(&quot;'+b.id.replace('MIQ-','')+'&quot;)">Request refund for '+b.id+'</button>').join(' ')+'</div>')}
function go(p){page=p;appView();setTimeout(addRefundButtons,0)}
function rateBooking(id){let stars=Number(prompt('Rate this service from 1 to 5'));if(!Number.isInteger(stars)||stars<1||stars>5)return;let comment=prompt('Optional comment')||'';api('/bookings/'+id+'/rating',{stars,comment}).then(()=>alert('Thank you for your rating.')).catch(()=>{let b=s.bookings.find(x=>x.id==='MIQ-'+id);if(b){b.rating=stars;b.comment=comment;save()}alert('Rating saved in the local demo.')})}
function viewInvoice(id){api('/bookings/'+id+'/invoice',null,'GET').then(x=>alert('Invoice '+x.invoice+'\\nService: '+x.booking.service+'\\nStatus: '+x.paymentStatus)).catch(()=>alert('Invoice MIQ-INV-'+id+'\\nPayment gateway is not enabled in this demo.'))}
function addAftercare(){if(!user||user.role!=='customer'||page!=='bookings')return;let completed=s.bookings.filter(b=>b.customer===user.name&&b.status==='COMPLETED');if(completed.length)$('#view').insertAdjacentHTML('beforeend','<div class="panel"><h3>Completed bookings</h3>'+completed.map(b=>'<div class="row"><div><b>'+b.id+' · '+b.service+'</b><div class="small">'+(b.rating?'Rated '+b.rating+'/5':'Please rate your experience')+'</div></div><span>'+(b.rating?'<button class="btn alt" onclick="viewInvoice(&quot;'+b.id.replace('MIQ-','')+'&quot;)">Invoice</button>':'<button class="btn" onclick="rateBooking(&quot;'+b.id.replace('MIQ-','')+'&quot;)">Rate service</button> <button class="btn alt" onclick="viewInvoice(&quot;'+b.id.replace('MIQ-','')+'&quot;)">Invoice</button>')+'</span></div>').join('')+'</div>')}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare()},0)}
function addPinField(){if(!user||user.role!=='customer'||page!=='book')return;let form=$('#bookform');if(form&&!form.pinCode)form.querySelector('label[for],label:nth-of-type(4)').insertAdjacentHTML('beforebegin','<label>Service PIN code</label><input name="pinCode" inputmode="numeric" pattern="\\\\d{6}" maxlength="6" placeholder="e.g. 712250" required>')}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare();addPinField()},0)}
function rescheduleBooking(id){let slot=prompt('Enter your new preferred date and time');if(!slot)return;api('/bookings/'+id+'/reschedule',{scheduledFor:slot}).then(()=>alert('Booking rescheduled.')).catch(()=>{let b=s.bookings.find(x=>x.id==='MIQ-'+id);if(b){b.slot=slot;save()}alert('Booking rescheduled in the local demo.')})}
function addRescheduleControls(){if(!user||user.role!=='customer'||page!=='bookings')return;let requested=s.bookings.filter(b=>b.customer===user.name&&b.status==='REQUESTED');if(requested.length)$('#view').insertAdjacentHTML('beforeend','<div class="panel"><h3>Change booking time</h3><p class="small">You can reschedule while a worker has not yet been assigned.</p>'+requested.map(b=>'<button class="btn alt" onclick="rescheduleBooking(&quot;'+b.id.replace('MIQ-','')+'&quot;)">Reschedule '+b.id+'</button>').join(' ')+'</div>')}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare();addPinField();addRescheduleControls()},0)}
function workerJobAction(id,action){let paths={way:'/on-the-way',startCode:'/start-code',start:'/start',endCode:'/end-code',complete:'/complete'},body={};if(action==='start'||action==='complete'){let code=prompt('Enter the 6-digit OTP shown by the customer');if(!code)return;body={code}}api('/bookings/'+id+paths[action],body).then(()=>{alert(action==='startCode'||action==='endCode'?'OTP sent privately to the customer notifications.':'Job updated.');go('jobs')}).catch(()=>{let b=s.bookings.find(x=>x.id==='MIQ-'+id);if(b){if(action==='way')b.status='ON_THE_WAY';if(action==='start')b.status='IN_PROGRESS';if(action==='complete')b.status='COMPLETED';save()}alert('Job updated in the local demo.');go('jobs')})}
function addWorkerLifecycle(){if(!user||user.role!=='worker'||page!=='jobs')return;let jobs=s.bookings.filter(b=>b.worker===user.name&&['ASSIGNED','ON_THE_WAY','IN_PROGRESS'].includes(b.status));if(jobs.length)$('#view').insertAdjacentHTML('beforeend','<div class="panel"><h3>Live job controls</h3>'+jobs.map(b=>'<div class="row"><div><b>'+b.id+' · '+b.status+'</b><div class="small">'+b.address+'</div></div><span>'+(b.status==='ASSIGNED'?'<button class="btn" onclick="workerJobAction(&quot;'+b.id.replace('MIQ-','')+'&quot;,&quot;way&quot;)">On the way</button>':b.status==='ON_THE_WAY'?'<button class="btn" onclick="workerJobAction(&quot;'+b.id.replace('MIQ-','')+'&quot;,&quot;startCode&quot;)">Request start OTP</button> <button class="btn alt" onclick="workerJobAction(&quot;'+b.id.replace('MIQ-','')+'&quot;,&quot;start&quot;)">Start job</button>':'<button class="btn" onclick="workerJobAction(&quot;'+b.id.replace('MIQ-','')+'&quot;,&quot;endCode&quot;)">Request completion OTP</button> <button class="btn alt" onclick="workerJobAction(&quot;'+b.id.replace('MIQ-','')+'&quot;,&quot;complete&quot;)">Finish job</button>')+'</span></div>').join('')+'</div>')}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare();addPinField();addRescheduleControls();addWorkerLifecycle()},0)}
async function submitLiveBooking(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));let payload={service:x.service,address:x.address,pinCode:x.pinCode,scheduledFor:x.slot,durationMinutes:Number(x.duration),optionLabel:x.option,promoCode:x.promo||null};try{await api('/bookings',payload);alert('Booking requested and saved to MakeItQuick.');go('bookings')}catch(err){s.bookings.push({id:'MIQ-'+(1001+s.bookings.length),...x,customer:user.name,worker:'Unassigned',status:'REQUESTED'});save();alert('Booking saved in the local demo: '+err.message);go('bookings')}}
async function loadLiveCustomerBookings(){if(!user||user.role!=='customer'||page!=='bookings'||!sessionStorage.getItem('miq.token'))return;try{let items=await api('/bookings',null,'GET');let v=$('#view');v.innerHTML='<div class="panel"><h3>Your live bookings</h3>'+(items.length?items.map(b=>'<div class="row"><div><b>MIQ-'+b.id+' · '+b.service+'</b><div class="small">'+b.scheduledFor+' · '+b.status+'<br>'+b.address+'</div></div><span>'+(b.status==='REQUESTED'?'<button class="btn alt" onclick="rescheduleLiveBooking('+b.id+')">Reschedule</button> <button class="btn" onclick="cancelLiveBooking('+b.id+')">Cancel</button>':'<span class="status">'+b.status+'</span>')+'</span></div>').join(''):'<p class="small">No bookings yet.</p>')+'</div>'}catch(err){}}
async function cancelLiveBooking(id){let reason=prompt('Why are you cancelling?');if(!reason)return;try{await api('/bookings/'+id+'/cancel',{reason});alert('Booking cancelled.');go('bookings')}catch(err){alert(err.message)}}
async function rescheduleLiveBooking(id){let scheduledFor=prompt('Enter the new preferred date and time');if(!scheduledFor)return;try{await api('/bookings/'+id+'/reschedule',{scheduledFor});alert('Booking rescheduled.');go('bookings')}catch(err){alert(err.message)}}
function addPinField(){if(!user||user.role!=='customer'||page!=='book')return;let form=$('#bookform');if(form&&!form.pinCode)form.querySelector('label[for],label:nth-of-type(4)').insertAdjacentHTML('beforebegin','<label>Service PIN code</label><input name="pinCode" inputmode="numeric" pattern="\\\\d{6}" maxlength="6" placeholder="e.g. 712250" required>');if(form)form.onsubmit=submitLiveBooking}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare();addPinField();addRescheduleControls();addWorkerLifecycle();loadLiveCustomerBookings()},0)}
async function loadLiveAdminBookings(){if(!user||user.role!=='admin'||page!=='bookings'||!sessionStorage.getItem('miq.token'))return;try{let [bookings,workers]=await Promise.all([api('/bookings',null,'GET'),api('/workers',null,'GET')]);let eligible=workers.filter(w=>w.kycStatus==='APPROVED'&&w.backgroundCheckStatus==='APPROVED'&&w.availability==='AVAILABLE');let v=$('#view');v.innerHTML='<div class="panel"><h3>Live dispatch bookings</h3>'+(bookings.length?bookings.map(b=>'<div class="row"><div><b>MIQ-'+b.id+' · '+b.service+'</b><div class="small">'+b.customer+' · '+b.address+'<br>'+b.scheduledFor+' · '+b.status+'</div></div>'+(b.status==='REQUESTED'?'<span><select id="worker-'+b.id+'"><option value="">Select eligible worker</option>'+eligible.map(w=>'<option value="'+w.userId+'">'+w.name+'</option>').join('')+'</select><button class="btn" onclick="assignLiveBooking('+b.id+')">Assign</button></span>':'<span class="status">'+b.worker+'</span>')+'</div>').join(''):'<p class="small">No live bookings yet.</p>')+'</div>'+(eligible.length?'':'<div class="notice">No eligible workers available. Approve KYC and ask the worker to set Available.</div>')}catch(err){}}
async function assignLiveBooking(id){let workerId=Number($('#worker-'+id).value);if(!workerId)return alert('Choose an eligible worker first.');try{await api('/bookings/'+id+'/assign',{workerId});alert('Worker assigned.');go('bookings')}catch(err){alert(err.message)}}
async function loadLiveWorkerJobs(){if(!user||user.role!=='worker'||page!=='jobs'||!sessionStorage.getItem('miq.token'))return;try{let jobs=await api('/bookings',null,'GET');let v=$('#view');v.innerHTML='<div class="panel"><h3>Your live jobs</h3>'+(jobs.length?jobs.map(b=>'<div class="row"><div><b>MIQ-'+b.id+' · '+b.service+'</b><div class="small">'+b.address+'<br>'+b.scheduledFor+' · '+b.status+'</div></div><span>'+workerButtons(b)+'</span></div>').join(''):'<p class="small">No assigned jobs yet.</p>')+'</div>'}catch(err){}}
function workerButtons(b){let id=b.id;if(b.status==='ASSIGNED')return '<button class="btn" onclick="workerJobAction('+id+',&quot;way&quot;)">On the way</button>';if(b.status==='ON_THE_WAY')return '<button class="btn" onclick="workerJobAction('+id+',&quot;startCode&quot;)">Request start OTP</button> <button class="btn alt" onclick="workerJobAction('+id+',&quot;start&quot;)">Start</button>';if(b.status==='IN_PROGRESS')return '<button class="btn" onclick="workerJobAction('+id+',&quot;endCode&quot;)">Request finish OTP</button> <button class="btn alt" onclick="workerJobAction('+id+',&quot;complete&quot;)">Finish</button>';return '<span class="status">'+b.status+'</span>'}
function go(p){page=p;appView();setTimeout(()=>{addRefundButtons();addAftercare();addPinField();addRescheduleControls();addWorkerLifecycle();loadLiveCustomerBookings();loadLiveAdminBookings();loadLiveWorkerJobs()},0)}
function addAddressPinField(){if(!user||user.role!=='customer'||page!=='account')return;let form=$('#addressform');if(form&&!form.pinCode)form.querySelector('button').insertAdjacentHTML('beforebegin','<label>PIN code</label><input name="pinCode" inputmode="numeric" pattern="\\d{6}" maxlength="6" placeholder="e.g. 712250" required>')}
function fillAddress(i){let address=s.addresses[i],form=$('#bookform');if(form&&address){form.address.value=address.address;if(form.pinCode)form.pinCode.value=address.pinCode||''}}
async function saveAddress(e){e.preventDefault();let address=Object.fromEntries(new FormData(e.target));let hasSession=!!sessionStorage.getItem('miq.token');try{if(hasSession){let saved=await api('/customer/addresses',address);s.addresses.unshift(saved)}else{s.addresses.push(address)}save();alert(hasSession?'Address saved securely to your account.':'Address saved on this device. Sign in to sync it.');go('account')}catch(err){alert('Could not save address: '+err.message)}}

function applyMaidItQuickBrand(){document.title='MaidItQuick Portal';let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);for(let node;node=walker.nextNode();){if(node.parentElement&&['SCRIPT','STYLE'].includes(node.parentElement.tagName))continue;let branded=node.nodeValue.replace(/\bMakeItQuick\b/g,'MaidItQuick').replace(/(?<![@\w])makeitquick\b/gi,'maiditquick');if(branded!==node.nodeValue)node.nodeValue=branded}}
applyMaidItQuickBrand();new MutationObserver(applyMaidItQuickBrand).observe(document.body,{childList:true,subtree:true,characterData:true});
function availabilityCard(status,label,message){let color=status==='AVAILABLE_NOW'?'#18783c':status==='AVAILABLE_LATER'?'#9a6700':'#b42318',dot=status==='AVAILABLE_NOW'?'🟢':status==='AVAILABLE_LATER'?'🟡':'🔴';return '<div id="availability-result" class="notice" style="border-left:4px solid '+color+'"><b>'+dot+' '+label+'</b><div class="small">'+message+'</div></div>'}
async function checkAvailability(){let form=$('#bookform'),result=$('#availability-result');if(!form||!result)return;let pin=form.pinCode&&form.pinCode.value.trim();if(!/^\d{6}$/.test(pin)){result.innerHTML='<b>Check availability</b><div class="small">Enter your 6-digit PIN code to see the earliest service time.</div>';return}try{let answer=await api('/availability?pinCode='+encodeURIComponent(pin),null,'GET');result.outerHTML=availabilityCard(answer.status,answer.label,answer.message)}catch(err){result.innerHTML='<b>Availability unavailable</b><div class="small">Please check again in a moment.</div>'}}
function addAvailabilityIndicator(){if(!user||user.role!=='customer'||page!=='book')return;let form=$('#bookform');if(!form)return;if(!$('#availability-result'))form.querySelector('h3').insertAdjacentHTML('afterend',availabilityCard('CHECK','Check availability','Enter your 6-digit PIN code to see the earliest service time.'));let pin=form.pinCode;if(pin&&!pin.dataset.availabilityBound){pin.dataset.availabilityBound='true';pin.addEventListener('input',checkAvailability);pin.addEventListener('change',checkAvailability)}checkAvailability()}
function fillAddress(i){let address=s.addresses[i],form=$('#bookform');if(form&&address){form.address.value=address.address;if(form.pinCode)form.pinCode.value=address.pinCode||'';checkAvailability()}}

async function loadLiveAreas(){if(!user||user.role!=='admin'||page!=='zones'||!sessionStorage.getItem('miq.token'))return;try{renderLiveAreas(await api('/operations/areas',null,'GET'))}catch(err){}}
