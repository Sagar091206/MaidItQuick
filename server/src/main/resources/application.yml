spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.local[.properties],optional:classpath:test-admin-overrides.properties
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/makeitquick?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Rishi@042405}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SSL:false}
server:
  port: ${PORT:8080}
  # HTTPS is production-ready and disabled by default for local development.
  # Enable it by exporting SSL_ENABLED=true and pointing SSL_KEYSTORE at a
  # PKCS12 keystore (e.g. from a load balancer or Let's Encrypt).
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
app:
  security:
    session-hours: 24
    reset-minutes: 30
    # HS256 signing secret for the customer JWT issued by /api/v1/auth. Must be
    # at least 32 characters in production (export JWT_SECRET).
    jwt-secret: ${JWT_SECRET:makeitquick-local-dev-secret-change-me-0123456789abcdef}
    jwt-expiry-days: ${JWT_EXPIRY_DAYS:30}
    # Customer OTP policy (unified /api/v1/auth flow).
    otp:
      expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      max-sends: ${OTP_MAX_SENDS:4}
      send-window-minutes: ${OTP_SEND_WINDOW_MINUTES:10}
  sms:
    # When false, the SMS provider is bypassed and OTPs are logged and echoed
    # back as devOtp for local development. Enable with SMS_ENABLED=true and
    # implement SmsSender with a real provider.
    enabled: ${SMS_ENABLED:false}
  uploads:
    directory: ${KYC_UPLOAD_DIRECTORY:uploads/kyc}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@maiditquick.local}
  admin:
    name: ${APP_ADMIN_NAME:MaidItQuick Admin}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  # ---- admin web module (Phase 1 merged into this process) ----
  jwt:
    secret: ${ADMIN_JWT_SECRET:mySuperSecretKeyThatIsAtLeast32CharactersLong123}
    access-minutes: 15
    refresh-days: 7
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  cookie-secure: false
  uploads-dir: ${UPLOADS_DIR:uploads}
  mail.reset-url: ${RESET_URL:https://localhost:5173}
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:a.k.bharati019@gmail.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:123456789101}
    support-email: ${SUPPORT_BOOTSTRAP_EMAIL:support@maiditquick.com}
    support-password: ${SUPPORT_BOOTSTRAP_PASSWORD:123456789101}
admin:
  datasource:
    url: ${ADMIN_DB_URL:jdbc:mysql://localhost:3306/maiditquick?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ADMIN_DB_USERNAME:root}
    password: ${ADMIN_DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 5MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
