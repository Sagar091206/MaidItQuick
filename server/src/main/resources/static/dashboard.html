      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }

  <!-- ======== Sticky topbar + horizontal navigation ======== -->
  <header class="topbar">
    <div class="topbar-main">
      <a class="topbar-brand" href="#/dashboard">
        <div class="logo">
          <img src="assets/logo/logo.svg" alt="MaidItQuick" width="36" height="36">
        </div>
        <div>
          <div class="name">MaidItQuick</div>
          <div class="sub">Admin Console</div>
        </div>
      </a>
      <div class="breadcrumbs" id="breadcrumbs"><span>MaidItQuick</span></div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg class="moon" width="18" height="18"><use href="#i-moon"/></svg>
          <svg class="sun" width="18" height="18"><use href="#i-sun"/></svg>
        </button>
        <div class="dropdown" id="profile-drop">
          <button class="topbar-user" id="profile-btn">
            <div class="avatar" id="top-avatar">—</div>
            <span class="t-name" id="top-name">—</span>
            <svg width="14" height="14" style="color:var(--text-3)"><use href="#i-chev-d"/></svg>
          </button>
          <div class="dropdown-panel" style="min-width:230px">
            <div class="profile-head">
              <div class="avatar" id="pd-avatar">—</div>
              <div style="min-width:0">
                <div class="p-name ellipsis" id="pd-name">—</div>
                <div class="p-mail ellipsis" id="pd-mail">—</div>
              </div>
            </div>
            <button class="dropdown-item" data-action="profile">
              <svg><use href="#i-admin"/></svg> My profile
            </button>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item danger" data-action="logout">
              <svg><use href="#i-logout"/></svg> Sign out
            </button>
          </div>
        </div>
      </div>
    </div>
    <nav class="topnav" id="topnav"><!-- rendered by app.js --></nav>
  </header>

  <!-- ======== Main ======== -->
  <div class="shell">
    <main class="shell-main" id="view"><!-- module content --></main>
  </div>

  <!-- ======== Print area ======== -->
  <div id="print-area"></div>

  <!-- ======== Toast host ======== -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- ======== Modal host ======== -->
  <div id="modal-host"></div>

  <!-- ======== Spinner host ======== -->
  <div id="spinner-host"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
