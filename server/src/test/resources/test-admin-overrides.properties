# Test-only overrides. Imported from application.yml via
# spring.config.import (optional:classpath:test-admin-overrides.properties).
# This file only exists on the test classpath, so production and the mobile
# run are unaffected; tests boot the full merged app, so both datasources and
# every admin property must resolve here.
admin.datasource.url=jdbc:h2:mem:admintest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
admin.datasource.driver-class-name=org.h2.Driver
admin.datasource.username=sa
admin.datasource.password=
admin.jpa.hibernate.ddl-auto=create-drop
admin.jpa.open-in-view=false
app.jwt.secret=test-admin-jwt-secret-at-least-32-chars-0123456789
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.cors-origin=http://localhost:5173
app.cookie-secure=false
app.uploads-dir=target/test-admin-uploads
app.mail.reset-url=http://localhost:5173
app.bootstrap.email=contract-admin@maiditquick.com
app.bootstrap.password=ContractPass-2026!
app.bootstrap.support-email=contract-support@maiditquick.com
app.bootstrap.support-password=ContractPass-2026!
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false
