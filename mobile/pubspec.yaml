name: maiditquick_mobile
description: Mobile MVP for MaidItQuick home services.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_secure_storage_platform_interface: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
